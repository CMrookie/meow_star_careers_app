# 一键起 coturn（STUN + TURN）
#
#   cd deploy/turn
#   vi turnserver.conf          # 改 realm / user / external-ip 三处
#   docker compose up -d && docker compose logs -f
#
# 说明：用 host 网络，避免映射 1.6 万个 UDP 中继端口，也绕开 UDP 端口映射的坑。
services:
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/etc/coturn/certs:ro   # 启用 TLS 时把证书放这里（可选）
    command: ["-c", "/etc/coturn/turnserver.conf"]
