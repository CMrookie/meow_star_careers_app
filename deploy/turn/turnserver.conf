# coturn 配置（阿里云 ECS / 任意有公网 IP 的 Linux）
# 部署步骤见同目录 README.md；改完用 `docker compose restart` 生效。
#
# ⚠️ 三处必须改：realm、user、external-ip（否则客户端收不到可用的 relay 候选）

listening-port=3478
tls-listening-port=5349

fingerprint
lt-cred-mech
realm=turn.example.com                     # 有域名写域名，没有就写公网 IP
user=meowapp:CHANGE_ME_STRONG_PASSWORD     # 客户端「用户名 / 密码」填这一对

# —— 最关键的一行 ——
# 必须显式声明公网 IP：否则 TURN 返回的 relay 地址是内网地址（172.x），
# 客户端拿到也连不上，「配了 TURN 但还是打不通」90% 是这里写错。
# 阿里云弹性公网 IP / NAT 场景写成「公网IP/内网IP」（内网地址见 `ip addr`，通常是 172.16.x.x）
external-ip=CHANGE_ME_PUBLIC_IP

# 中继端口段：安全组必须一并放行（UDP）
min-port=49152
max-port=65535

# 安全：禁止中继到内网网段，避免这台机器被当成内网跳板
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255

# 配额：防止被陌生人当免费代理刷流量（按需调整；中继很吃带宽，见 README）
total-quota=100
user-quota=12
stale-nonce=600

no-cli
no-multicast-peers
no-loopback-peers
log-file=stdout
simple-log

# 可选：TLS（有域名 + 证书后再开，客户端用 turns:<域名>:5349）
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
